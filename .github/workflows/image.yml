# Publishes the container images a Portainer stack (deploy/portainer/) pulls:
#
#   ghcr.io/<owner>/romeka-s               the server, the `runtime` stage
#   ghcr.io/<owner>/romeka-s-office-tools  the office worker, the `office-tools` stage
#
# A push to main tags `latest` and `sha-<short>`; a `v1.2.3` tag adds `1.2.3`
# and `1.2`. A rollback points ROMEKA_IMAGE at an earlier `sha-` or version tag.
# amd64 only: the ffmpeg stage builds from source, and under emulation an arm64
# build would take hours.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: romeka-s
            target: runtime
          - image: romeka-s-office-tools
            target: office-tools
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry path must be lower case, and an owner name may not be.
      - id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # One cache scope per target: the two jobs run at once, and a shared
      # scope would let each overwrite the other's cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
