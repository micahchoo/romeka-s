[package]
name = "omeka-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Romeka S media subsystem: file store, ingesters, renderers and thumbnails."

[lints]
workspace = true

[dependencies]
omeka-core = { path = "../omeka-core" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom = "0.2"
# Content-based media type detection from magic bytes, the stand-in for
# upstream's `finfo` (libmagic). MIT, pure Rust; its `cfb` feature reads the
# compound file of a legacy Office document (doc, xls, ppt).
infer = "0.22"
sha2 = "0.10"
# Decoding and resizing for the thumbnailer (`File/Thumbnailer/Gd.php`): the
# four source formats GD accepts (gif, jpeg, png, webp) plus tiff, a deliberate
# addition for archive masters.
image = { version = "0.25", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
# JPEG 2000 thumbnails (`thumbnailer/jp2.rs`): pure Rust, MIT OR Apache-2.0.
# Without its default features it has no dependencies; it decodes at a reduced
# resolution, so a large master costs a fraction of its pixels.
hayro-jpeg2000 = { version = "0.4", default-features = false, features = ["std"] }
# An uploaded SVG is filtered to an allow list of SVG elements and attributes
# (`svg.rs`, `File/Thumbnailer/Gd.php` has no SVG decoder). Parser-based, from
# Cloudflare, Apache-2.0 OR MIT.
svg-hush = "0.9"
# The SVG rasterizer behind an SVG thumbnail (`svg.rs`). Pure Rust,
# Apache-2.0 OR MIT. Its default features read text, embedded raster images and
# gzip-compressed SVG; the thumbnail is drawn at the file's own size, capped at
# the large derivative.
resvg = "0.48"
# A JPEG over 64 MB thumbnailed with IDCT scaling (`thumbnailer/large.rs`), so
# only an eighth of each side is ever decoded. Pure Rust, MIT OR Apache-2.0;
# `rayon` is off.
jpeg-decoder = { version = "0.3", default-features = false }
# Embedded metadata (EXIF) of an image, for the archive import's tag preview.
# Pure Rust, BSD-2-Clause.
kamadak-exif = "0.6"
# A TIFF's directories, read by seeking: kamadak-exif reads a TIFF whole, and
# an archive master can be 60 MB. Already in the tree through `image`.
tiff = "0.11"
# EXIF, IPTC and XMP text that is not UTF-8 is read as Windows-1252
# (`image_metadata`). Already in the tree through the sheet reader.
encoding_rs = "0.8"
# The XMP packet of an image, read by namespace. MIT; the version oxrdfio
# already brings into the tree.
quick-xml = "0.37"
# The real HTTP client behind `HttpFetch`. Blocking, because the trait is.
# `rustls` is the TLS provider; `gzip` is off, matching upstream's
# `Accept-Encoding: identity` (`File/Downloader.php:57`).
ureq = { version = "~3.4", default-features = false, features = ["rustls"] }
# Joining a `Location` header onto the request URL for the same-scheme redirect
# rule in `src/http_client.rs`. Already in the workspace tree via sqlx.
url = "2"
# The S3 store's request signing (SigV4 presigned URLs) and its XML answers.
# Sans-IO, so the blocking ureq client above sends every request. BSD-2-Clause.
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "xml"] }
# A still made by an external tool is written to a file the tool opens, and the
# PDF page the tool writes is read back from one (`tool.rs`). The store benches
# also need a temporary root. MIT OR Apache-2.0.
tempfile = "3"
# The one warning a missing or failing tool leaves. The server and the CLI
# install a subscriber; a library test does not, and the macro is a no-op there.
tracing = "0.1"

[dev-dependencies]
# Legacy Office fixtures for the media type tests: a compound file with a
# chosen root CLSID. Both are already in the tree through `infer`.
cfb = "0.14"
uuid = "1"
# The micro-benchmark runner. `plotters` and `rayon` are off, so the benches
# emit the text report and the machine-readable `estimates.json` without
# pulling a charting stack into the workspace.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# One target per area benched; every one is a `harness = false` binary that
# `criterion_main!` drives.
[[bench]]
name = "store_paths"
harness = false

[[bench]]
name = "ingest_parse"
harness = false

[[bench]]
name = "render_html"
harness = false

[[bench]]
name = "thumbnail"
harness = false
