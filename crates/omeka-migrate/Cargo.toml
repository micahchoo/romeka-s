[package]
name = "omeka-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
omeka-core = { path = "../omeka-core" }
omeka-db = { path = "../omeka-db", features = ["mysql"] }
