[package]
name = "omeka-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Romeka S command line and job runner."

[lib]
name = "omeka_cli"
path = "src/lib.rs"

[[bin]]
name = "romeka"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The MySQL and MariaDB backend (`--database-url`). On by default, so the
# `romeka` binary serves either engine; `--no-default-features` builds a
# SQLite-only binary.
default = ["mysql"]
mysql = ["omeka-db/mysql"]

[dependencies]
async-trait = "0.1"
# `bcrypt` hashes a key credential the way upstream `Entity/ApiKey::setCredential`
# does (`password_hash($credential, PASSWORD_BCRYPT)`), so the hash `omeka-api`
# verifies is one this command wrote.
bcrypt = "0.17"
chrono.workspace = true
clap = { version = "4", features = ["env"] }
omeka-api = { path = "../omeka-api" }
omeka-core = { path = "../omeka-core" }
omeka-db = { path = "../omeka-db" }
omeka-media = { path = "../omeka-media" }
omeka-server = { path = "../omeka-server" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
# The backfill streams an original a tool must open into a temporary file, so
# a video is never held whole (`commands/thumbnails.rs`). Tests use it too.
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# The server sends its job processes TERM, then KILL, on shutdown
# (`jobs/dispatcher.rs`, `ProcessDispatch::shutdown`) without unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# `tests/import_staging.rs` writes the ZIPs it uploads.
flate2 = "1"
axum = "0.8"
# `tests/media_derivatives.rs` drives the router in-process with `oneshot`.
tower = { version = "0.5", features = ["util"] }
