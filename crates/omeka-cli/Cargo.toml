[package]
name = "omeka-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Romeka S command line and job runner."

[lib]
name = "omeka_cli"
path = "src/lib.rs"

[[bin]]
name = "romeka"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
# `bcrypt` hashes a key credential the way upstream `Entity/ApiKey::setCredential`
# does (`password_hash($credential, PASSWORD_BCRYPT)`), so the hash `omeka-api`
# verifies is one this command wrote.
bcrypt = "0.17"
chrono.workspace = true
clap = "2"
omeka-api = { path = "../omeka-api" }
omeka-core = { path = "../omeka-core" }
omeka-db = { path = "../omeka-db" }
omeka-media = { path = "../omeka-media" }
omeka-server = { path = "../omeka-server" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
