[package]
name = "omeka-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Romeka S /api REST layer: wire types, JSON-LD and the read and write endpoints."

[dependencies]
# `bcrypt` verifies the key credential the way upstream `password_verify` does
# (`Entity/ApiKey::verifyCredential`, PASSWORD_BCRYPT).
bcrypt = "0.17"
chrono.workspace = true
http = "1"
indexmap = { version = "2", features = ["serde"] }
# The HTML sanitizer the site-page and html-media write paths run
# (`Omeka\Stdlib\HtmlPurifier`).
omeka-core = { path = "../omeka-core" }
omeka-db = { path = "../omeka-db" }
# The site-page write regenerates a Romeka block's plain rendering through the
# block's own plain renderer (`omeka-site/src/blocks/romeka.rs`), so the two
# cannot drift. `omeka-site` holds no I/O, so this stays a value dependency.
omeka-site = { path = "../omeka-site" }
# media delete removes the stored bytes (`Module::deleteMediaFiles`), so the
# delete handler reaches `omeka-media`'s store. Imports flow api -> media -> core.
omeka-media = { path = "../omeka-media" }
# The extension seam: the adapter spec and operation vocabulary, and the
# registry that carries a plugin adapter into routing and the read dispatch.
omeka-plugin = { path = "../omeka-plugin" }
serde = { workspace = true }
# preserve_order keeps the PHP insertion order of `serde_json::Value` members
# (`o:ini`, `o:args`, `o:item_pool`, `o:layout_data`, media `data`). Without it
# a `serde_json::Map` is a BTreeMap and would sort those keys.
serde_json = { workspace = true, features = ["preserve_order"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = { workspace = true }
# `write::media::prepare` runs the media ingester, which does blocking network
# and file I/O, on `spawn_blocking`, so a fetch never holds an async worker. The
# `rt` feature is the minimum the blocking pool needs; every other tokio feature
# this crate tests with is a dev-dependency.
tokio = { version = "1", features = ["rt"] }
# Import v2 stores paths and row keys NFC (`import/plan/path.rs`), so a name
# typed on macOS and one read from Linux are one entry. Already in the lock.
unicode-normalization = "0.1"
# The vocabulary importer reads the RDF serialisations upstream's EasyRdf reads
# (`Stdlib/RdfImporter`): RDF/XML, Turtle, N-Triples and JSON-LD. oxrdfio is the
# Oxigraph project's parser set, one crate per syntax behind one interface.
oxrdfio = "0.2"
# The term types oxrdfio's parsers yield.
oxrdf = "0.3"
# The import v2 sheet reader (`import/sheet/decode.rs`) guesses an unmarked
# sheet's encoding with Mozilla's detector, so a Shift-JIS or Cyrillic sheet is
# named and refused instead of read as Windows-1252. encoding_rs decodes UTF-16
# and Windows-1252 and is the detector's own encoding type.
chardetng = "1"
encoding_rs = "0.8"
# The import v2 file pattern compiles with the regex crate (JS ∩ Rust subset).
regex = "1"
# The import v2 unzip job (`import/unzip.rs`) inflates deflated ZIP entries
# and checks their CRC-32. Already in the lock (omeka-server uses it).
flate2 = "1"
# SHA-256 as a stream, three uses: the import model's digest
# (`import::model::Model::seal`), files over 64 MB as they go into the store
# (`import/media_in.rs`), and identical-file hashing (`import/scan/identical.rs`).
sha2 = "0.10"
# Import v2 workbook sheets (`import/sheet/workbook.rs`): .xlsx, .xls and .ods
# read as rows. MIT, pure Rust; dates come as serial numbers, so no chrono.
calamine = "0.37"
# The zip directory of an .xlsx or .ods, read before calamine opens it, so a
# workbook that unpacks past its bound is refused unread. calamine's own zip.
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
# The click meter (`import/clicks.rs`) for the server's held-out table, which
# reads it on each held-out shape. Off in every build that ships.
meter = []

[dev-dependencies]
# Generates the round-trip, malformed-body and query-parsing cases the fifteen
# fixed fixtures cannot reach (`tests/property_wire.rs`,
# `tests/property_boundary.rs`).
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# `tests/relations_batch.rs` counts the statements sqlx executes through this
# crate's logger; sqlx logs each statement at debug through `log`.
log = "0.4"
# The import v2 evidence tests build real folder trees, symlinks included.
tempfile = "3"
# The import v2 tag tests write small real JPEG and TIFF files.
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff"] }
# The workbook tests write real .xlsx files as Excel would (MIT OR Apache-2.0),
# and a compound file for .xls (already in the tree through `infer`).
rust_xlsxwriter = "0.100"
cfb = "0.14"
# The proposer's literal lint parses its sources (`preview/proposal/lint_tests.rs`).
syn = { version = "2.0.119", default-features = false, features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = "1"

[lints]
workspace = true
