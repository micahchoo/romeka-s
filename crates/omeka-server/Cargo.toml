[package]
name = "omeka-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Romeka S HTTP surface: the /api router and the public site routes."

[dependencies]
axum = "0.8"
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
omeka-api = { path = "../omeka-api" }
omeka-core = { path = "../omeka-core" }
omeka-db = { path = "../omeka-db" }
omeka-media = { path = "../omeka-media" }
omeka-site = { path = "../omeka-site" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
# The staged-upload sweep test moves the clock past an upload's 24 hours.
chrono.workspace = true
# Test setup only: the server reaches every table through `omeka-db`, so the
# library itself has no `sqlx` to write a statement with.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "mysql"] }
# `tests/common/engine.rs` runs a test on MySQL when `ROMEKA_MYSQL_URL` is set.
omeka-db = { path = "../omeka-db", features = ["mysql"] }
# The held-out table reads the click meter on each held-out shape.
omeka-api = { path = "../omeka-api", features = ["meter"] }
bcrypt = "0.17"
tempfile = "3"
# The list upload tests send a real .xlsx, written as Excel writes one.
rust_xlsxwriter = "0.100"

[lints]
workspace = true
